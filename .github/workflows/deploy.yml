name: Deploy to GitHub Pages

# Runs only after CI succeeds on main (CLAUDE.md 8.2). Repo name is read from the
# event, so base-href works for any repository without editing this file.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate build-info.ts
        run: |
          SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          cat > src/environments/build-info.ts <<EOF
          // Generated by deploy.yml at build time. Do not edit by hand.
          export const buildInfo = {
            sha: '${SHA}',
            runNumber: ${{ github.event.workflow_run.run_number }},
            builtAt: '$(date -u +%Y-%m-%dT%H:%M:%SZ)',
          };
          EOF
          cat src/environments/build-info.ts

      - name: Install deps
        run: npm ci

      - name: Build (base-href = repo path)
        run: npm run build -- --configuration production --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/configure-pages@v5
        with:
          enablement: true   # turn Pages on (Actions source) using the workflow token; no manual Settings step

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/smell-risk-dashboard/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
